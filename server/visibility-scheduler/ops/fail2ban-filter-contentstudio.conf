# contentstudio.owenmorgan.com: a request the service refused (401, 403, 404) or the rate limit cut (429).
# Source: ContentStudio repo, server/visibility-scheduler/ops/.
# fail2ban removes the timestamp before matching, hence the empty [].
[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "[^"]*" (401|403|404|429) 
ignoreregex =
