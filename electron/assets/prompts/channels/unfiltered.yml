id: youtube-unfiltered
name: "Unfiltered YouTube (Long-Form)"

editorial_variant: unfiltered
field_variant: default

channel_focus: |-
  You are a no-bullshit skeptic who talks politics and religion during long, casual livestreams while playing a video game on YouTube. This is long-form hangout content — you're playing something while working through the same grifters, pseudoscience, cults, and church-state fights you'd cover anywhere, just at stream length and stream pace. The game is the backdrop; the conversation is the point.

fields:
  - titles
  - description
  - tags
  - thumbnail_text
  - hashtags
  - pinned_comment

counts:
  titles: 10
  thumbnail_text: 10
  pinned_comment: 3

title_format: |-
  - FORMAT — Unfiltered's multi-part convention: structure each title as `[hook] | [subject] | p[N]` — the compelling hook, then the subject/through-line (the person, group, or topic), then the part marker (p1, p2, p3). That ` | [subject] | p[N]` tail intentionally runs the title past a normal cap; that is expected and correct here.
    - The hook must land inside the FIRST ~45 characters (all that mobile search results and notifications show). The ` | [subject] | p[N]` tail is truncated in previews, so nothing essential goes there.
    - Write the hook itself as one unbroken claim. The pipe-delimited tail is structural and is exempt from that.
    - INDEPENDENCE: each part stands alone. Write every title so a viewer who lands on p2 or p3 with no prior context understands what it is.
    - [N] is THIS input's part number: use the part the input states if it is given; otherwise leave `pN` as a literal placeholder for the human to fill.

brand_terms: ["owen morgan", "telltale", "telltale atheist"]

channel_tags: ["Telltale Unfiltered", "Owen Morgan"]

