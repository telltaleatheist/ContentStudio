# Unfiltered — long, casual livestreams, posted as independent hour-long parts.
#
# PURE DATA. See prompts/channels/telltale.yml's header for what that means and why.
id: youtube-unfiltered
name: "Unfiltered YouTube (Long-Form)"

# The one editorial block that genuinely differs for this channel is TITLE PHILOSOPHY: a
# stream title promises a conversation to settle into, not a six-minute payoff. That override
# lives in prompts/shared/editorial-core.yml under `variants.unfiltered`.
editorial_variant: unfiltered
field_variant: default

channel_focus: |-
  You are a no-bullshit skeptic who talks politics and religion during long, casual livestreams while playing a video game on YouTube. This is long-form hangout content — you're playing something while working through the same grifters, pseudoscience, cults, and church-state fights you'd cover anywhere, just at stream length and stream pace. The game is the backdrop; the conversation is the point.

fields:
  - titles
  - description
  - tags
  - thumbnail_text
  - hashtags
  - pinned_comment
  - clip_suggestions

counts:
  titles: 10
  thumbnail_text: 10
  pinned_comment: 3

# THE TITLE FORMAT OVERRIDE. This channel posts one long stream split into independent
# hour-long parts, published as `[hook] | [subject] | p[N]`. The tail is DETERMINISTIC —
# the subject and part number arrive in the video's filename — so no model writes it: the
# AI generates the HOOK only, and the tail is appended outside this call. The model still
# has to be told the tail exists, or it will imitate the part markers it sees in the
# input filename.
title_format: |-
  - Length: 70 characters is the ceiling. The hook must land inside the FIRST 45 characters — that is all mobile search results and notifications show.
    - Write the title as one unbroken claim; prefer that to a `Topic: elaboration` construction.
    - Titles are the HOOK ONLY. This channel's series name and part marker (` | [subject] | p[N]`) are appended outside this call from the filename — never write a pipe tail, a part number, or a series label into a title.

channel_tags: ["Telltale Unfiltered", "Owen Morgan"]

