# Telltale — the main religion channel.
#
# PURE DATA. Nothing in this file tells a model HOW to write; it says what this channel IS,
# which fields it publishes, and what gets appended to them. Every instruction the model reads
# comes from prompts/shared/. That separation is the whole point of the layout: a new channel is
# this file and nothing else.
#
# `id` is the stored prompt-set id, unchanged from the yml this replaces, so an existing
# settings store and every historical job JSON keep resolving.
id: youtube-telltale
name: "Telltale YouTube (Religion)"

# Which shared editorial variant this channel takes (prompts/shared/editorial-core.yml).
editorial_variant: default
# Which shared field-instruction variant it takes (prompts/shared/fields/*.yml `overrides`).
field_variant: default

# The one editorial slot a channel fills: a SHORT paragraph naming the through-line. It is the
# {channel_focus} placeholder in editorial-core.yml's `mission` block.
channel_focus: |-
  You are a no-bullshit skeptic exposing religious grifters, pseudoscience pushers, and cult leaders on YouTube — cults are the through-line of the whole channel and the core of what you do. Religion, faith, and the high-control, true-believer mindset are always your lens here: charismatic leaders, the grifts, and the pseudoscience that run on the same machinery. Where a subject carries a political dimension, on this channel it always has a religious or cult angle, and that angle is what you lead with; this channel does NOT do straight politics — stay out of politics-adjacent territory (QAnon and the like) and find the faith, grift, or cult core instead.

# WHICH FIELDS THIS CHANNEL PUBLISHES.
#
# This list is the statement the old prompt sets made by which `##` sections they contained
# (`promptSetSectionKeys`), now said outright. A field absent here is not generated, not routed
# and not assembled, and the run's log says so — which is how the Spreaker podcast set has never
# had thumbnails without that looking like a section gone missing.
#
# Order is the order the sections are emitted in.
fields:
  - titles
  - description
  - tags
  - thumbnail_text
  - hashtags
  - pinned_comment

# How many options each list field asks for.
counts:
  titles: 10
  thumbnail_text: 10
  pinned_comment: 3

# The creator's search surfaces, named INSIDE the TAGS instruction ({brand_terms}).
#
# NOT channel_tags. `channel_tags` below are appended verbatim by code after the model has
# answered; these are the terms the model is told to work into the list it writes, and they are
# the ones a viewer actually types. The old flat prompt sets carried this list inline in every
# channel's `## TAGS` section — "channel brand terms (owen morgan, telltale, telltale atheist)" —
# and every tag list the operator has shipped contains them. Genericised to a bare "channel brand
# terms" the line was unfollowable and the model started inventing creator names ("O. Morgan").
brand_terms: ["owen morgan", "telltale", "telltale atheist"]

# Channel and creator tags, appended to every generated tag list by code.
# The tags adapter is trained to leave these out ("those are appended separately"),
# so without this key a locally generated tag list never names the channel.
channel_tags: ["Telltale", "Owen Morgan"]

