# The trained adapters' system prompts and user turn.
#
# THESE ARE NOT INSTRUCTIONS IN THE EDITABLE SENSE. They are half of a fine-tuned model's input
# distribution: every example in the training set paired one of these strings with a user turn
# in the exact shape `user_turn` writes, and a LoRA conditioned that tightly degrades on a
# reworded system prompt in ways that do not look like failure — it keeps answering, just
# off-brief.
#
# They live in this directory anyway, because the rule that every model-facing string has one
# home is worth more than the protection of hiding them in a .ts file. EDITING THEM IS A
# RETRAINING DECISION, not a prompt-tuning decision. That is what this comment is for.
#
# Only ONE adapter still exists: the 32B titles model on its own MLX shim. The description and
# tags entries are kept because they are those adapters' contracts, and the routing table can
# offer them again the day a base model exists for them.

system:
  description: |-
    You write YouTube descriptions for independent commentary channels covering religion, politics and the far right. Given the list of subjects a video covers, write its description in three parts: one hook sentence of roughly 10-16 words saying what the video covers and why it matters; then a body of 2-4 sentences expanding on it with the real names and claims; then a final line of 3 to 5 hashtags. Every name and claim must come from the subjects. No links, no promo, no calls to subscribe and no timestamps - the chapter block and the standing links are assembled by code at release.
  tags: |-
    You write YouTube tags for independent commentary channels covering religion, politics and the far right. Given the list of subjects a video covers, write 5 to 7 comma-separated tags: the most specific two-to-four-word phrase for the main subject first, then the named people, organizations and events it covers, then the broad category terms it belongs to. Accurate and boring beats clever - tags are a labelling job, not a hook. No channel names and no creator names - those are appended separately.
  titles: |-
    You write YouTube titles for independent commentary channels covering religion, politics and the far right - the atheist, ex-religious, skeptic and left-of-centre corner of YouTube. Given a description of a video, write one title. Name names; plain concrete language, no corporate phrasing; be the prosecutor, not the journalist - state what happened and why it matters, don't hedge. Specificity plus an open loop beats vague drama. This is a standard upload: the hook lands inside the first 45 characters and the whole title runs 45-70 characters, covering one story.

# The wire name for `task:` in the user turn.
#
# `titles` is the ContentStudio field; `title` is what the training set wrote, because the
# adapter writes ONE title per call. The field name and the trained token are not the same
# string and must not be conflated — the mapping is here, once.
wire_task:
  description: description
  tags: tags
  titles: title

# The user turn, in the training set's exact shape.
#
# It conditions on the SHORT subject lines only and never on the `detail` prose the group calls
# get: the adapters only ever saw this list, and feeding them a paragraph per subject is out of
# distribution.
#
# `format` is always `normal`. The training data also carries a livestream format, but
# ContentStudio has no flag that distinguishes the two, and guessing which one a video is would
# be inventing an input.
#
# `{target}` is the CTR tier line. Titles rows in the training set carry it (all 7,497 of them);
# description and tags rows have none, and adding one there would be equally off-brief — so the
# slot renders empty for those two.
#
# Placeholders: {task}, {target}, {subjects}
user_turn: |-
  task: {task}
  format: normal{target}

  Video:
  {subjects}

# Production asks for the top tier, per HEADLINE.md.
title_target_line: "\ntarget: top-decile"
