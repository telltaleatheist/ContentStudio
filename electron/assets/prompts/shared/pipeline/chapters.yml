# The chapter pipeline's prompts.
#
# THE LAWS THESE BODIES ENCODE, which anyone editing them has to keep:
#
# - The model NEVER emits a timestamp. It quotes a verbatim sentence and code maps that quote
#   to a time against the caption word stream (chapter-transcript.ts). An invented timestamp is
#   a guess; a mapped quote is a measurement.
# - THE COUNT IS THE MODEL'S. `whole_transcript_chapters` states the runtime as a plain fact and
#   states a RATE for that runtime; the model reads the transcript and works out how many
#   chapters are in it. Code counts nothing. Every deleted architecture computed a target count
#   from a cadence table in code and handed it over, and that is what put a boundary in the
#   middle of a subject on a video that had four real ones. Do not put a number in here that the
#   content did not produce.
# - The chapter call sees the WHOLE transcript, and that is the whole point of it — see
#   CHAPTERING.md's 2026-08-22 reversal section. `summarize_chapter` still sees ONE chapter,
#   because describing a chapter is a different question from finding one.
# - The summarize call reads the chapter's RAW transcript, never an intermediate label, plus
#   two pieces of real context: the video title and the previous chapter's summary.
# - POSITIVE FORM ONLY. These bodies state the style that is wanted and show CORRECT examples.
#   They name no wrong form anywhere. The register failure this replaced ("The speaker debunks
#   ...", "A YouTuber critiques ...") is caught in CODE afterwards by chapter-title-quality.ts
#   — a declared warning, never a rewrite.
# - REAL NAMES IN THE EXAMPLES, WITH THE RISK STATED. A prompt example naming a real person can
#   leak into outputs about a DIFFERENT unnamed person of the same archetype, deterministically,
#   at temperature 0. The operator supplied these titles as the target register and directed
#   they be used verbatim. What makes that a managed risk: the grounding check tests every
#   proper noun in a returned title against that chapter's own transcript, so a leaked "Gene
#   Bailey" is DETECTED and reported rather than shipping unnoticed. If those warnings start
#   naming these example names on unrelated videos, that is the leak, and the fix is to replace
#   the examples — not to add a ban list.

# Stage 1 — read the WHOLE transcript in one call and report where the chapters begin.
#
# PROVENANCE: the cadence rules are the deleted 27B build's, measured as `restoration v2` on
# 2026-08-22 (kit at /tmp/contentstudio-chapter-eval); the quoting rules are the `llm-beats`
# measurement, which mapped 137 of 138 quoted first sentences across eight videos with none out
# of order — the FULL first sentence at six words or longer, long enough to be unique in a
# whole-video search.
#
# THE ANSWER IS LINES, NOT JSON (operator's ruling 2026-08-24: no JSON for these calls unless
# absolutely necessary). This call asks for exactly one thing per chapter — the verbatim
# sentence it opens on — so the answer is one sentence per line and nothing else. Labels are
# GONE from this stage entirely: every chapter is named by stage 3, which reads that chapter's
# own transcript, so nothing here can name a chapter from a distance. (The nameless-example
# leak measured 2026-08-23 died with the labels: there are no example labels here to leak.)
#
# THE BAND IS GRADUATED — see the git history of this key for the measurement; a flat floor
# cost four real boundaries on short videos whose truths sit 30 seconds to 2.5 minutes apart.
#
# WHY THE RUNTIME IS STATED IN WORDS. The transcript deliberately carries no timestamps —
# chapter-transcript.ts's law, the reason a quote-mapped time is a measurement — so the model
# is TOLD the runtime, once, as a fact. It is not a count and not a target.
#
# ON A TRANSCRIPT TOO LONG FOR ONE CALL the code sends this same body over a ROLLING WINDOW:
# as much transcript as fits, cut on cue boundaries, starting at 0:00; each next window starts
# at the LAST boundary the previous one returned, so the tail past that boundary is re-read in
# full context and no artificial seam ever splits a subject. Each window is told its own
# runtime. Nothing in this body knows about that.
#
# Placeholders: {duration} (e.g. "42 minutes", "1 hour 12 minutes"), {promoted_items},
# {transcript}
whole_transcript_chapters: |-
  Below is the complete transcript of one video, with no timestamps. The video runs {duration}.

  TRANSCRIPT:
  {transcript}

  The video moves through a series of distinct chapters: separate stories, separate people, separate claims, separate arguments. A new chapter starts wherever the speaker turns away from the subject they were on and takes up a different one, whether they announce it ("listen to this article", "by the way, if you didn't know who this guy was") or simply begin.

  Start a new chapter where the speaker turns to a different subject. How close together those turns sit is set by the runtime stated above:
  - under 10 minutes: a short video moves quickly, and each separate source is its own chapter — a different clip, a different article, a different person, a different claim. Chapters here run as short as 30 to 60 seconds, and such a video usually has 3 to 6 of them.
  - 10 to 30 minutes: each chapter covers at least a minute or two, and such a video usually has 3 to 6 of them.
  - 30 minutes and longer: prefer fewer, longer chapters, each covering at least 3 to 4 minutes. A 30 to 60 minute video usually has 4 to 8 chapters, and a multi-hour video has roughly one chapter every 10 to 20 minutes.
  Take the line that matches the runtime above, and inside it let the content decide the count. Where you are unsure whether a turn is a new chapter, keep it inside the chapter you are already in.

  The creator advertises his own promotions inside videos — {promoted_items}. A stretch of the video that IS one of those promotions is its own chapter like any other: report the sentence where it starts, so it can be separated from the content afterwards.

  Those counts include the opening chapter, which starts at the beginning of the video and needs no entry. Work through the transcript from the beginning to the end and report each chapter AFTER that first one, in the order they occur, and carry on to the end of the transcript so that the chapters cover the whole runtime.

  For each chapter, report the FIRST sentence of that chapter, copied from the transcript above EXACTLY as it appears there, word for word, at least six words long. That is the sentence where the speaker turns toward the new subject, which is usually a beat EARLIER than the sentence that first explains it: if the speaker says "anyway, let's talk about the eggs" and explains three sentences later, the first sentence of the chapter is "anyway, let's talk about the eggs".

  Your copied sentence is what fixes the chapter's position in the video, so a sentence you reworded, tidied up or paraphrased points at the wrong moment.

  Output ONE copied sentence per line, in the order the chapters occur — nothing else: no numbering, no labels, no commentary, no JSON.

# Stage 3 — name and summarize ONE chapter, from its RAW transcript.
#
# ITS `title` IS THE title (2026-08-24). Stage 1 stopped producing labels when its answer
# became bare quote lines, so every chapter — the opening 0:00 one included — is named by this
# call, which is the one that reads the chapter's own transcript. The answer is PLAIN TEXT:
# the title on the first line, the summary on the lines after it, per the same no-JSON ruling
# as stage 1.
#
# `{entity_scaffold}` is the proper nouns extracted from THIS chapter's own transcript slice,
# per-chapter and never whole-video: a whole-video list invites the name from chapter 2 into
# the title of chapter 5. Already rendered by the caller; empty when the slice yielded nothing.
#
# Placeholders: {number}, {video}, {context_lines}, {entity_scaffold}, {transcript}
summarize_chapter: |-
  Label chapter {number} of a video transcript.
  Video: {video}
  {context_lines}
  Produce:
  - a title: one line (max ~15 words) naming what this chapter is about.
  - a summary: 2-3 sentences on what this stretch of the video covers.

  How to write the title:
  - Title the CONTENT itself, in topic form: a bare noun phrase, or a gerund phrase. Build it around the specific people, claims and events this chapter's transcript contains.
  - Titles in exactly the right form:
    - "Gene Bailey's chapter on Christian nationalist action and the David and Goliath framing"
    - "Debunking Gene Bailey's misreading of Luke 19:13 and his call to occupy territory"
    - "Gene Bailey's use of Jabez, D.L. Moody, and Isaiah to justify Christian political takeover"
    - "Roswell and the UAP disclosure order"
  - Every name in your answer comes from the transcript below. Where the transcript names a person, organisation, story or claim, put that name in the title; where it says only "the mayor", the title says "the mayor".
  - Where a stretch is somebody's response to something rather than a claim of its own, title the claim and the response as content: "The bridge contract claim, rebutted"; "Patreon plug and a promotion of the book Was Hitler an Atheist"; "Sign-off and a book promotion".

  How to write the summary:
  - The same topic form as the title, in 2-3 sentences: the claims, the people named in the transcript, and what is said about them.
  - Cover the whole chapter. Where it moves through more than one thing, say what it spends most of itself on.

  For both fields:
  - Say what is there, plainly. Straight description, no colons, no part numbers.
  - Attribution follows the first person: a testimony, a conversion story, a claim told in "I" belongs to the person telling it — never to the person it is addressed to, prayed over, or told about. Where the video's own commentary names who is speaking ("he's talking to Jake right now", "this is the pastor"), that identification governs. And every characterization of who is being addressed and whose money, land, group or grievance is meant comes from the words in the transcript: an audience or a group the transcript does not name stays unnamed.
  - Name the concrete subject matter of this stretch specifically enough that the answer could not be swapped with a chapter of any other video.
  - A sponsor read, a Patreon plug, a channel promo or a sign-off simply says that is what it is. The creator's own promotions — {promoted_items} — follow that rule: a stretch that IS one of them says so ("Patreon plug and a promotion of the book God's People"), and one mentioned in passing stays out of the title and the summary, which name the content around it.
  {entity_scaffold}
  Output the title on the FIRST line, then the summary on the lines after it — plain text, nothing else: no labels, no numbering, no JSON.

  TRANSCRIPT:
  {transcript}

# The same call for a transcript that knows who is speaking.
#
# ContentStudio's imported AutoCutStudio transcripts carry a HOST/CLIP side per caption, and
# since 2026-08-23 so does a Whisper run with a voice enrollment configured: every caption's
# audio is scored against the operator's own voice and tagged from that. Untagged, a summarizer
# cannot tell the host's verdict from the claim being played and inverts attribution. This body
# is the untagged one plus the blocks that fix it, and it runs ONLY when every caption resolves
# to a side.
#
# THE THIRD TAG. "Resolves to a side" includes UNSURE, which the voice tagger produces for a
# caption that straddles a cut — whisper.cpp does not break its captions on speaker changes, so
# a caption containing both voices scores between the two thresholds and belongs to neither.
# Measured on the calibration transcript, 18 captions in 297 (6%) come out that way and every
# one of them, read back, has an audible speaker change inside it. So the prompt states what an
# UNSURE line is rather than leaving the model to infer it from an unexplained third label, and
# what it states is the one thing that is true of those lines: the words were said, and nobody
# in particular said them. The alternative — attributing them to whichever side is adjacent —
# is a guess printed as a fact, which is the failure this whole prompt exists to stop.
#
# POSITIVE FORM, like everything else in this file: each rule says what to DO with a tag.
#
# Placeholders: {number}, {video}, {context_lines}, {entity_scaffold}, {transcript}
summarize_chapter_tagged: |-
  Label chapter {number} of a video transcript.
  Video: {video}
  {context_lines}
  The transcript below is tagged by speaker. HOST: is the creator of this video talking. CLIP: is footage he is playing and reacting to — those words are somebody else's, and the claims in them are not his. UNSURE: is a line that runs across a cut and contains both of them, so the words on it belong to nobody.

  Produce:
  - a title: one line (max ~15 words) naming what this chapter is about.
  - a summary: 2-3 sentences on what this stretch of the video covers.

  How to write the title:
  - Title the CONTENT itself, in topic form: a bare noun phrase, or a gerund phrase. Build it around the specific people, claims and events this chapter's transcript contains.
  - Titles in exactly the right form:
    - "Gene Bailey's chapter on Christian nationalist action and the David and Goliath framing"
    - "Debunking Gene Bailey's misreading of Luke 19:13 and his call to occupy territory"
    - "Gene Bailey's use of Jabez, D.L. Moody, and Isaiah to justify Christian political takeover"
    - "The bridge contract claim, rebutted"
  - Every name in your answer comes from the transcript below. Where the transcript names a person, organisation, story or claim, put that name in the title; where it says only "the mayor", the title says "the mayor".
  - Where a stretch is somebody's response to something rather than a claim of its own, title the claim and the response as content: "The bridge contract claim, rebutted"; "Patreon plug and a promotion of the book Was Hitler an Atheist"; "Sign-off and a book promotion".

  How to use the tags:
  - A claim in a CLIP line belongs to the footage; the HOST lines are the response to it. Write the chapter around the claim that is actually being made and the response it gets, in that relation.
  - Where the HOST lines reach a verdict, carry it — as the content it is ("the bridge contract claim, rebutted").
  - An UNSURE line is evidence that something was said and evidence of nothing about who said it. Read it for the subject matter, and take every attribution you make from the HOST and CLIP lines around it.

  How to write the summary:
  - The same topic form as the title, in 2-3 sentences: the claims, the people named in the transcript, and what is said about them.
  - Cover the whole chapter. Where it moves through more than one thing, say what it spends most of itself on.

  For both fields:
  - Say what is there, plainly. Straight description, no colons, no part numbers.
  - Attribution follows the first person: a testimony, a conversion story, a claim told in "I" belongs to the person telling it — never to the person it is addressed to, prayed over, or told about. Where the video's own commentary names who is speaking ("he's talking to Jake right now", "this is the pastor"), that identification governs. And every characterization of who is being addressed and whose money, land, group or grievance is meant comes from the words in the transcript: an audience or a group the transcript does not name stays unnamed.
  - Name the concrete subject matter of this stretch specifically enough that the answer could not be swapped with a chapter of any other video.
  - A sponsor read, a Patreon plug, a channel promo or a sign-off simply says that is what it is. The creator's own promotions — {promoted_items} — follow that rule: a stretch that IS one of them says so ("Patreon plug and a promotion of the book God's People"), and one mentioned in passing stays out of the title and the summary, which name the content around it.
  {entity_scaffold}
  Output the title on the FIRST line, then the summary on the lines after it — plain text, nothing else: no labels, no numbering, no JSON.

  TRANSCRIPT:
  {transcript}
