whole_transcript_detailed: |-
  Below is the complete transcript of one video, with no timestamps. The video runs {duration}.

  TRANSCRIPT:
  {transcript}

  Split this video into youtube chapters. The video works through one subject; a new chapter starts where the focus moves within it — the next clip on the same story, the article's next claim, the next example taken up, the next person responding: the same subject, seen from its next angle.

  A chapter is a stretch, not a sliver: half a minute is as short as one runs, and a few seconds of connective tissue belong to the chapter beside them. A 10-minute video usually has 5 to 10 chapters, and a longer one carries roughly one every minute or two.

  An ad, promotion, or plug — {promoted_items} — is its own chapter however short it runs: report the sentence where it starts, and the first sentence of the content it returns to.

  The opening chapter starts at the beginning of the video and needs no entry. For each chapter after it, report the FIRST sentence of that chapter, copied from the transcript above EXACTLY as it appears there, word for word, at least six words long — a sentence you reworded, tidied up or paraphrased points at the wrong moment.

  Output ONE copied sentence per line, in the order the chapters occur — nothing else: no numbering, no labels, no commentary, no JSON.

whole_transcript_broad: |-
  Below is the complete transcript of one video, with no timestamps. The video runs {duration}.

  TRANSCRIPT:
  {transcript}

  Split this video into youtube chapters. The video works through one subject; a new chapter starts where the video moves to a distinctly different piece of it — a new person taken up, a new document or clip set, a new line of argument — and the claims inside one piece stay together.

  A chapter is a stretch of several minutes. How many that makes is set by the runtime stated above:
  - under 10 minutes: usually 3 to 5 chapters
  - 10 to 30 minutes: usually 4 to 7, each covering 3 to 6 minutes
  - 30 minutes and longer: usually 7 to 10, each covering 4 to 6 minutes

  Treat the band as a budget, not a suggestion: land in the lower half of it when the material allows, and when two neighbouring stretches could be one chapter, they are one chapter.

  An ad, promotion, or plug — {promoted_items} — is its own chapter however short it runs: report the sentence where it starts, and the first sentence of the content it returns to.

  The opening chapter starts at the beginning of the video and needs no entry. For each chapter after it, report the FIRST sentence of that chapter, copied from the transcript above EXACTLY as it appears there, word for word, at least six words long — a sentence you reworded, tidied up or paraphrased points at the wrong moment.

  Output ONE copied sentence per line, in the order the chapters occur — nothing else: no numbering, no labels, no commentary, no JSON.

whole_transcript_stories: |-
  Below is the complete transcript of one video, with no timestamps. The video runs {duration}.

  TRANSCRIPT:
  {transcript}

  Split this video into youtube chapters. The video is a run of separate stories; a new chapter starts where one story ends and a different one begins — a new story, claim, clip, or ad.

  A chapter is a stretch of minutes, not seconds. How many that makes is set by the runtime stated above:
  - under 10 minutes: usually 3 to 6 chapters
  - 10 to 30 minutes: usually 3 to 6, each at least a minute or two
  - 30 minutes and longer: usually 4 to 8, each covering at least 3 to 4 minutes

  An ad, promotion, or plug — {promoted_items} — is its own chapter however short it runs: report the sentence where it starts, and the first sentence of the content it returns to.

  The opening chapter starts at the beginning of the video and needs no entry. For each chapter after it, report the FIRST sentence of that chapter, copied from the transcript above EXACTLY as it appears there, word for word, at least six words long — a sentence you reworded, tidied up or paraphrased points at the wrong moment.

  Output ONE copied sentence per line, in the order the chapters occur — nothing else: no numbering, no labels, no commentary, no JSON.

summarize_chapter: |-
  Title chapter {number} of a video transcript.
  Video: {video}
  {context_lines}
  Produce:
  - a title: one line, up to 15 words — the specific people, claims and events in this stretch, concrete enough that it could only be this video.
  - a summary: 2-3 sentences on what this stretch of the video covers.

  Every name in your answer comes from the transcript below: where the transcript names a person, organisation, story or claim, use that name; where it says only "the mayor", say "the mayor". An audience or a group the transcript does not name stays unnamed.
  Attribution follows the first person: a testimony, a conversion story, a claim told in "I" belongs to the person telling it — never to the person it is addressed to, prayed over, or told about. Where the video's own commentary names who is speaking ("he's talking to Jake right now", "this is the pastor"), that identification governs. A stretch that is a response to a claim is titled by the claim and the verdict on it, as content: "The bridge contract claim, rebutted".
  A stretch that IS one of the creator's own promotions — {promoted_items} — simply says that is what it is ("Patreon plug and a promotion of the book God's People"); one mentioned in passing stays out of the title and the summary, which name the content around it. That list exists so you can recognize an ad: the names and sites in it belong to the ads, and every person your answer names comes from the transcript below.
  {entity_scaffold}
  Output the title on the FIRST line, then the summary on the lines after it — plain text, nothing else: no labels, no numbering, no JSON.

  TRANSCRIPT:
  {transcript}

summarize_chapter_tagged: |-
  Title chapter {number} of a video transcript.
  Video: {video}
  {context_lines}
  The transcript below is tagged by speaker. HOST: is the creator of this video talking. CLIP: is footage he is playing and reacting to — those words are somebody else's, and the claims in them are not his. UNSURE: is a line that runs across a cut and contains both of them, so the words on it belong to nobody: read it for its subject matter, and take every attribution you make from the HOST and CLIP lines around it.

  Produce:
  - a title: one line, up to 15 words — the specific people, claims and events in this stretch, concrete enough that it could only be this video. A claim in a CLIP line belongs to the footage and the HOST lines are the response to it: write the chapter around that relation, and where the HOST lines reach a verdict, carry it.
  - a summary: 2-3 sentences on what this stretch of the video covers.

  Every name in your answer comes from the transcript below: where the transcript names a person, organisation, story or claim, use that name; where it says only "the mayor", say "the mayor". An audience or a group the transcript does not name stays unnamed.
  Attribution follows the first person: a testimony, a conversion story, a claim told in "I" belongs to the person telling it — never to the person it is addressed to, prayed over, or told about. Where the video's own commentary names who is speaking ("he's talking to Jake right now", "this is the pastor"), that identification governs. A stretch that is a response to a claim is titled by the claim and the verdict on it, as content: "The bridge contract claim, rebutted".
  A stretch that IS one of the creator's own promotions — {promoted_items} — simply says that is what it is ("Patreon plug and a promotion of the book God's People"); one mentioned in passing stays out of the title and the summary, which name the content around it. That list exists so you can recognize an ad: the names and sites in it belong to the ads, and every person your answer names comes from the transcript below.
  {entity_scaffold}
  Output the title on the FIRST line, then the summary on the lines after it — plain text, nothing else: no labels, no numbering, no JSON.

  TRANSCRIPT:
  {transcript}
