# The blocks that used to live as string constants in system-prompts.ts.
#
# They are here for the same reason everything else is: there is now exactly ONE directory a
# person has to open to read every word this app sends a model. The code that used to hold
# these strings keeps only the assembly logic, and throws naming this file and the missing key
# rather than substituting anything.
#
# PLACEHOLDERS use the {name} convention and are filled with FUNCTION replacers, because
# transcript text routinely contains $-patterns ($&, $', $`) that a plain string replacement
# would expand and corrupt.

# Prepended to every PLAIN-TEXT field request (operator's ruling 2026-08-24: no JSON for
# these calls unless absolutely necessary — the per-field OUTPUT FORMAT below names each
# call's plain shape).
plain_system: |-
  Answer with ONLY what the OUTPUT FORMAT below asks for, as plain text.
  No emoji, no smart quotes or dashes; accented letters in real names are the correct
  spelling of those names and stay. No markdown, no JSON, no commentary — just the answer.

# Prepended to the COMPILATION request, which is the one whole-metadata JSON call left in the
# app (a mode the operator selects; its multi-field object is the one answer here that is
# genuinely structured enough to need JSON).
#
# "Use ASCII characters only" was the old second line. It banned "Beyoncé" and "Muñoz" as
# collateral damage on a rule aimed at emoji and smart punctuation, so it now says what it
# means.
json_system: |-
  Return a valid JSON object containing ONLY the fields requested below.
  Write it in plain text: no emoji, no smart quotes or dashes. Accented letters in real names
  are the correct spelling of those names and stay. No markdown, no explanation — just the JSON object.

# Compilation framing, prepended to the {subject} block.
#
# POSITIVE FORM. This block used to carry a WRONG/CORRECT example pair for the title and a
# five-line "WRONG (do not do this)" description sample. Both are gone: a model shown a wrong
# form reproduces it, and the same rules state cleanly as what to do.
#
# Placeholders: {sourceCount}, {contentTypes}
compilation_context: |2

  === COMPILATION MODE ===
  This is a COMPILATION of {sourceCount} separate items ({contentTypes}).

  CRITICAL REQUIREMENTS:
  1. For the TITLE: pick the SINGLE most compelling item and base the title on that ONE subject.
     - Each item covers a SEPARATE topic — treat them as unrelated, and keep each title inside one item.
     - Either use ONE item's subject, or use a generic compilation umbrella title.
     - One-subject example: "Glenn Beck's AI George Washington Is Unhinged"
     - Umbrella example: "3 Wild Political Stories You Need to See"

  2. For the DESCRIPTION: output ONLY a bulleted list.
     - Use "-" prefix for each line
     - Write exactly {sourceCount} lines, one per item
     - Each line: compelling 1-2 sentence summary in your editorial voice
     - The first character of your description is "-" and the last character is the end of the last bullet.

     CRITICAL: The order MUST match the ITEM numbers below!
     - Line 1 of your list = ITEM 1
     - Line 2 of your list = ITEM 2
     - And so on...

  CORRECT DESCRIPTION FORMAT (just this, nothing else):
  - Summary for ITEM 1 here
  - Summary for ITEM 2 here
  - Summary for ITEM 3 here
  ===

# Appended AFTER the assembled instructions to replace the TITLES / DESCRIPTION / TAGS rules
# in compilation mode.
#
# Placeholder: {sourceCount}
compilation_instructions_override: |2

  ## COMPILATION MODE OVERRIDES

  This is a compilation of {sourceCount} separate items. The rules in this section REPLACE the TITLES, DESCRIPTION, and TAGS rules above. Every other section still applies unchanged.

  TITLES (replaces the rules above):
  - Generate 10 title options, 45-60 characters each
  - Each title focuses on ONE specific item's subject, or is a generic umbrella title covering the set
  - Include a mix: some titles based on different items, some umbrella titles
  - Example umbrella: "{sourceCount} Stories That Will Blow Your Mind" (illustration only — never output it verbatim)

  DESCRIPTION (replaces the rules above):
  - Output ONLY a bulleted list using "-" prefix
  - Write exactly {sourceCount} bullet points, one per item, in ITEM order
  - Each bullet: compelling 1-2 sentence summary of that item's subject
  - The first character of your description is "-" and the last character is the end of the last bullet

  TAGS (replaces the rules above):
  - 15-20 tags that reflect ALL {sourceCount} items in the compilation
  - Include key names, topics, and themes from EACH item
  - Mix of broad topics and specific phrases
  - Format as comma-separated list

# The measured table of contents, prepended to the {subject} block whenever the chapter
# pipeline produced one.
#
# Placeholder: {chapterList}
chapter_subjects_context: |2

  === WHAT THIS VIDEO ACTUALLY COVERS ===
  The chapters below were already worked out from the transcript, in order, each one
  described from its own section of the video. This is the video's real contents, and it
  is what viewers will see listed under it. Where a chapter has an indented second line,
  that is what happens in it, in more detail.

  {chapterList}

  Let this list decide what the video is ABOUT. Weight it by how much of the video each
  subject takes up, and stay inside it - if something is not in this list, the video did
  not spend real time on it.
  ===

# The CHAPTER DIGEST — what the content slot carries on an item whose transcript is over the
# direct-pass ceiling.
#
# WHY IT EXISTS. Over the ceiling the pipeline used to run a blind chunk summarizer and hand the
# field calls its output; the summarizer's own log line admitted what that cost ("verbatim quotes
# and phrasing do not survive that step"), and the operator's ruling on 2026-08-23 was: "I don't
# want summaries. We should try to pass the whole thing in. If we're using summaries instead then
# it should be in the form of chapters being passed in." The chapter list is a condensation the
# pipeline has ALREADY paid for and that was written the right way round - each chapter's
# paragraph comes from that chapter's OWN raw transcript, one call per chapter, so the specifics
# inside it are the video's words rather than a paraphrase of a paraphrase.
#
# It REPLACES `chapter_subjects_context` on that path rather than sitting beside it: both render
# the same table of contents, and printing it twice would tell the model the video has twice as
# much in it as it does. So this block carries the same "let the list decide what the video is
# about" instruction, plus the timestamps and the statement that there is no fuller transcript in
# this prompt.
#
# Placeholder: {chapterList}
chapter_digest: |2

  === WHAT THIS VIDEO ACTUALLY COVERS ===
  This video's transcript is longer than one call can read, so what follows is the video
  in chapter form: every chapter in order, the time it starts, and what happens in it.
  Each chapter's indented paragraph was written from that chapter's own section of the
  transcript, so the specifics in it - the names, the claims, the numbers - are the
  video's own and can be used as such.

  {chapterList}

  This IS the video, as much of it as this call gets; there is no fuller transcript below.
  Let this list decide what the video is ABOUT. Weight it by how much of the video each
  subject takes up, and stay inside it - if something is not in this list, the video did
  not spend real time on it. Take your specifics from the paragraphs.
  ===

# OUTPUT FORMAT for the COMPILATION call — the one whole-metadata JSON call left in the app.
