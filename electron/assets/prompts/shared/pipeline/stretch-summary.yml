# The stretch summary (LEDGER #288): one paragraph for every five minutes of a video, written
# from that stretch's own transcript, merged in order. Titles, thumbnail text, the pinned comment
# and the thumbnail words read it instead of the whole transcript (Owen, 2026-10-10: "i think
# summaries produce better titles"). Slots: {start} {end} {total} {tagged} {transcript}.

instruction: |-
  Below is one stretch of a video's transcript, {start} to {end} of a {total} video. The speaker is the host; he often reads or plays clips of other people and reacts to them.{tagged}

  Write ONE paragraph, 90 to 160 words, saying what happens in this stretch:
  - Every person, group, book, place, event and number by name, spelled as the transcript has them.
  - The specific claims made, and who makes them: the host, or the person in the clip he is reacting to. A claim the host reads out from someone else is that person's claim, and the host's answer to it is his.
  - The host's own position on each claim, and any admission, reaction or line that stands out, quoted exactly when the wording matters.
  - Plain present-tense narration ("He reads...", "Metaxas claims..."), no "the creator" or "this video", no judgement of your own, nothing the stretch does not say.

  Answer with the paragraph alone.

  TRANSCRIPT ({start}-{end}):
  {transcript}

# Appended to the instruction's first paragraph when the stretch is speaker-tagged.
tagged: |-
  Each line is labelled with who is speaking: HOST is the host, CLIP is a clip he plays, UNSURE is either.

# What the field calls read, in place of the chapter list or the transcript. Slot: {paragraphs}.
block: |-
  === WHAT THIS VIDEO ACTUALLY COVERS ===
  What follows is the video summarized in order, one paragraph for every five minutes of it,
  each with the time its stretch starts. Each paragraph was written from that stretch's own
  section of the transcript, so the specifics in it - the names, the claims, the numbers, the
  quotes - are the video's own and can be used as such.

  {paragraphs}

  This IS the video, as much of it as this call gets; there is no fuller transcript below.
  Let these paragraphs decide what the video is ABOUT. Weight each subject by how many
  paragraphs it takes up, and stay inside them - if something is not in them, the video did
  not spend real time on it. Take your specifics from the paragraphs.
  ===
