section: TITLES

instructions: |-
  ## TITLES

  - Generate {titles_count} youtube titles.
  - Find the underlying argument behind this video and sell that.
  - Write them like you'd say them to a friend — blunt, spoken, a verdict.
  - Call people what the audience recognizes — their movement, their side, their role; a name alone only when the name itself is famous.
  - When the subject has a euphemism for what they're doing, put it in quotes.
  - A title that carries a claim this video argues against names it as that person's claim — x claims y, x wants y, the "y" myth — never states it as fact. The verdict in a title is the video's own verdict, aimed the way the video aims it, and blunt never outranks this rule.
  - When your input is the video's chapter list, each title takes its story from ONE chapter: never combine names or claims that sit in different chapters into one title.
  - All lowercase.
  {title_format}
  - Every title is about the video's subject. The channel's own promotions — {promoted_items} — are ad reads inside the video; the titles are built from the content around them.
  - The top 3 titles are for YouTube's Test & Compare, which measures watch time per impression: make them genuinely different angles on the argument.
  - Work out the argument before you write, but answer with the titles alone: one per line, nothing else.

default_title_format: |-
  - Length: 50 to 70 characters, with the hook inside the FIRST 45 — that is all mobile search results and notifications show.

self_check:
  - "Each title: 50-70 characters, hook inside the first 45"
  - "Each title all lowercase"
  - "Top 3: genuinely different angles on the argument"

overrides:
  shorts:
    instructions: |-
      ## TITLES

      - Generate {titles_count} options that represent genuinely DIFFERENT ANGLES. Apply the swap test as you go: if two of your titles could be exchanged and nobody would notice, one of them is redundant — replace it with a new angle rather than a new wording.
      - Before generating, identify at least 3 distinct framings, then distribute titles across them. Framing types include:
        - Name + specific claim (front-load who and what)
        - Reaction/verdict (your take on the moment)
        - Cliffhanger (incomplete information that demands the click)
        - Plain-language reframe (strip the jargon, state the absurdity)
        - Challenge/confrontation (direct address to subject or audience)
      {title_format}
      - Front-load the subject name OR the accusation in the first 3-4 words
      - Fragments over complete sentences — "Pastor's worst lie" is the shape, and its case is the case: capitals on the first word and real names only
      - Every title is about the clip's subject; the channel's own promotions ({promoted_items}) are ad reads, and titles are built from the content around them
      - TRANSCRIPT/CLIP inputs: anchor titles to the actual moment in the clip
      - SHORT DESCRIPTION inputs: keep to the quotes and reactions the input states or clearly implies
      - Person-focused titles lead with the name only where the person is recognizable. Otherwise lead with what they said or did.
    default_title_format: |-
      - 40 characters MAX (hard limit — count carefully)
    self_check:
      - "Each title 40 characters or fewer — count them"
      - "Swap test: no two titles interchangeable"

  spreaker:
    instructions: |-
      ## TITLES

      - Generate {titles_count} options that represent genuinely DIFFERENT ANGLES. Apply the swap test as you go: if two of your titles could be exchanged and nobody would notice, one of them is redundant — replace it with a new angle rather than a new wording.
      - Before generating, internally identify at least 5 distinct framings, then distribute titles across them. Framing types include:
        - Plain-language reframe (strip the euphemism, say what they're actually doing in human terms)
        - Specific accusation (name the lie, name the claim, name the failure)
        - Investigative framing (position as research, fact-check, deep dive)
        - Schadenfreude (the subject embarrassing themselves with their own words)
        - Protective framing (who this harms and why it matters)
        - Counter-narrative (turn the subject's self-image against them)
        - Debunk/exposed format (clear signal of what the episode delivers)
        - Pattern/trend (connect to a bigger picture or movement)
        - Simple declarative (just state the damning fact plainly)
      {title_format}
      - At least 2 titles must be EVERGREEN-framed: the durable claim or doctrine someone will still type into a search box a year from now, fact-checked, rather than the news hook
      - Full names spelled out correctly, no nicknames alone, no episode numbers, no show name, no emojis
      - Sentence case: capitals on the first word and real names only
      - Every title is about the episode's subject; the show's own promotions ({promoted_items}) are ad reads, and titles are built from the content around them
      - Front-load the subject name OR the plain-language reframe in the first 3-5 words
      - TRANSCRIPT/SUMMARY inputs: anchor at least 5 titles to specific claims, arguments, or quotes from the input
      - SHORT DESCRIPTION inputs: keep to the quotes, admissions and reactions the input states or clearly implies
      - Person-focused titles lead with recognizable names. Where the subject is not widely known, lead with what they DID or CLAIMED and let the name follow.
      - The top 3 titles should test genuinely different hypotheses about what hooks listeners — different angles, different emotional appeals, different entry points into the topic.
    default_title_format: |-
      - Length: 70 characters is the ceiling, and around 60 is the sweet spot. The searchable core — the name, the claim, or the reframe — sits inside the FIRST 30-40 characters; mobile list views cut from the end.
    self_check:
      - "Each title: searchable core inside the first 40 characters, none over 70 total, no episode numbers, no emojis, no show name"
      - "At least 2 evergreen-framed titles present"
      - "Swap test: no two titles interchangeable"
