# The DESCRIPTION section.
#
# WHO READS THIS. Everything that writes a description, which since 2026-08-22 includes the
# routed path again:
#
#   - DescriptionUnit's two schema-constrained calls (prompts/shared/pipeline/description.yml)
#     take this block whole, as their `{rules}`. The hook call writes sentence 1 of paragraph 1
#     and the body call writes the rest, and each says so; the rules below are what both are
#     bound by. They used to be withheld from those calls on the argument that they
#     over-specify a small model, and the one production run that happened under that
#     arrangement wrote a 324-word synopsis of the narrator with no second paragraph and no CTA
#     — on a prompt that reaches Sonnet and Opus unchanged. The note in the pipeline file
#     records the measurement.
#   - the COMPILATION call, which is the one surviving whole-metadata request and has always
#     read these rules in full.
#
# It also declares that the channel publishes a description at all (the `fields` list in
# prompts/channels/*.yml).
section: DESCRIPTION

# The body call's word range, per field variant, as DATA so the number in the prompt and the
# number description-unit.ts warns against are one number. It measures the BODY only — the hook
# is a separate call under its own character cap — and a body outside it is a declared warning
# on a paragraph that still publishes, never a truncation.
#
# Per variant because the variants are different documents: a YouTube description is two
# paragraphs, a Spreaker episode note is 150-250 words by its own rule below, and a Shorts
# description is two or three sentences nobody reads. One shared number would have made the
# warning wrong on two channels out of three.
#
# The YouTube floor is 130 rather than the spec's 150 because the body is now the description
# MINUS its opening line: the hook is its own call under its own cap, and the descriptions this
# channel shipped through 2026-08-16 ran 165-230 words of prose after that first sentence.
body_words: [130, 300]

instructions: |-
  ## DESCRIPTION

  - Two paragraphs separated by one blank line
  - Paragraph 1 (3-5 sentences): Sentence 1 must work standalone as a search snippet — primary search phrase within the first 60 characters, and the full hook inside the first 157 characters (everything before "Show more"). No line breaks inside the paragraph. Write it like the opening line of a news segment, not a diary entry.
  - Sentences 2-3: The specific claims being debunked, fact-checked, or exposed. Weave in 1-2 secondary keywords naturally.
  - Final sentence: Channel positioning or soft CTA.
  - Paragraph 2 (2-3 sentences): Below-the-fold search context — secondary keywords, related search terms, names and topics woven into readable sentences. Keep it genuine; keyword-stuffed walls of text are dead weight and get ignored.
  - TRANSCRIPT/SUMMARY inputs: reference the single most damaging or absurd specific claim from the input in sentence 1
  - SHORT DESCRIPTION inputs: frame the topic and subject factually
  - Voice: confident, direct, slightly pissed. Banned phrases: "I'm still shaking," "what happened next," "you won't believe," "worse than we all feared," "everything changed," "broke the internet," "let that sink in," "I need to talk about this," "and honestly," "here's the thing," "buckle up"
  - Register: the description is a summary of what the video is about, written about the content itself. Write about the claims, the events and the arguments themselves, built around the real names the input gives you — "Gene Bailey's chapter on Ziklag tells Christians to weaponize their wounds"; "Iowa spent three years blocking the Satanic Temple's holiday display". These are full sentences with finite verbs, not catalogue entries: the names go in as possessives or objects, and the subject of every sentence is a person, claim or event from inside the video — the page making the claim, the argument under examination, the evidence that undoes it.

self_check: []

overrides:
  shorts:
    instructions: |-
      ## DESCRIPTION

      - 2-3 sentences maximum (nobody reads Shorts descriptions — this is for the algorithm)
      - Sentence 1: subject name + primary keyword + what the clip shows. Functional, not persuasive.
      - Sentence 2: secondary keyword and content categorization context
      - The CTA lives in the pinned comment, not here
      - Keep it factual and keyword-rich; the clickbait-filler list applies here too
      - Voice doesn't matter here — this is metadata for machines, not humans
    self_check: []
    body_words: [25, 60]

  spreaker:
    instructions: |-
      ## DESCRIPTION

      - 150-250 words, plain text
      - FIRST 120 CHARACTERS (critical): Spotify shows ~120 characters and Apple ~150 before "show more" — this fragment must work as a standalone pitch that makes someone press play. Include the primary search phrase and the subject's full name, and be specific about what the episode delivers. No line breaks inside it.
      - Body: Expand on the specific claims debunked, evidence examined, or story told. Include concrete payoffs that signal depth: "every source traced", "each claim checked against the record", "the money followed to where it actually goes"
      - Use the primary search phrase once or twice more, woven naturally, plus related terms and every important name spelled fully — Spotify's semantic search rewards natural topical coverage; mechanical repetition does nothing and keyword stuffing violates Apple's guidelines
      - End with a brief CTA (subscribe, leave a review, check the website)
      - Keep the show title and host name out of it
      - TRANSCRIPT/SUMMARY inputs: reference the single most damaging or absurd specific claim from the input in the first 120 characters
      - SHORT DESCRIPTION inputs: frame the topic and subject factually
      - Voice: confident, direct, authoritative. Banned phrases: "I'm still shaking," "what happened next," "you won't believe," "worse than we all feared," "everything changed," "let that sink in," "I need to talk about this," "and honestly," "here's the thing," "buckle up"
      - Register: the note is a summary of what the episode is about, written about the content itself. Write about the claims, the events and the arguments themselves, built around the real names the input gives you — "Gene Bailey's chapter on Ziklag tells Christians to weaponize their wounds"; "Iowa spent three years blocking the Satanic Temple's holiday display". These are full sentences with finite verbs, not catalogue entries: the names go in as possessives or objects, and the subject of every sentence is a person, claim or event from inside the episode — the page making the claim, the argument under examination, the evidence that undoes it.
    self_check: []
    body_words: [150, 250]
