section: DESCRIPTION

tagged_addendum: |-
  - The transcript this description is written from is tagged by speaker: HOST: lines are this channel talking, CLIP: lines are the footage being reacted to, UNSURE: lines run across a cut and belong to nobody. Attribution comes from the tags rather than from context — a CLIP line's claim belongs to the footage and to whoever is named making it there, a HOST line's argument is the channel's own verdict, and an UNSURE line's content is written about with no speaker attached. The register rules above still govern every sentence: a HOST verdict is carried as the content it is — the claim collapses, the evidence undoes it, the policy turns out to be mainstream — with the claims, the evidence and the people named on the CLIP lines as the subjects of the sentences.

body_words: [60, 200]

instructions: |-
  ## DESCRIPTION

  - ONE paragraph, 4-6 sentences, no line breaks inside it. The chapter list is appended below it by code, so the paragraph is the whole prose description.
  - Sentence 1 must work standalone as a search snippet — primary search phrase within the first 60 characters, and the full hook inside the first 157 characters (everything before "Show more"). Write it like the opening line of a news segment, not a diary entry.
  - Middle sentences: The specific claims being debunked, fact-checked, or exposed, with the real names and 2-3 secondary keywords woven in naturally. Keep it genuine; keyword-stuffed text is dead weight and gets ignored.
  - Final sentence: the video's strongest closing beat — the verdict that lands, the last claim undone, the question left standing — inside the video like every sentence before it. This is a description of the video, not of the channel (operator, 2026-08-24).
  - A complete description in exactly the right shape — it is from ANOTHER video and shows the form only; every name in yours comes from the input: "A Black community just showed America exactly how to deal with Nazi threats — by exercising their Second Amendment rights and standing united. After fascists showed up to terrorize residents the day before, the community organized an armed defense that sent a clear message: hate won't be tolerated here. Fascists thrive on fear and easy targets, but they scatter like roaches when faced with organized resistance — this community didn't wait for permission or rely on institutions that have historically failed them. This is what real patriotism looks like." 
  - TRANSCRIPT/SUMMARY inputs: reference the single most damaging or absurd specific claim from the input in sentence 1
  - SHORT DESCRIPTION inputs: frame the topic and subject factually
  - Voice: confident, direct, slightly pissed. Banned phrases: "I'm still shaking," "what happened next," "you won't believe," "worse than we all feared," "everything changed," "broke the internet," "let that sink in," "I need to talk about this," "and honestly," "here's the thing," "buckle up"
  - The channel's own promotions appear inside videos without being any video's subject — {promoted_items}. All of them are covered by the standing links block that code appends under the description, so every sentence of the description is spent on the video's subject: the claims, the people and the events under examination. The promotions appear in no sentence of it.
  - Register: this is a YouTube description — it sells the video to a stranger scrolling past, in the channel's own confident voice. Write about the claims, the events and the arguments themselves, built around the real names the input gives you — "Gene Bailey's chapter on Ziklag tells Christians to weaponize their wounds"; "Iowa spent three years blocking the Satanic Temple's holiday display while the man who axed their statue got probation"; "Islam has become the new target of the far right"; "Televangelist claims aliens stole her eggs". These are full sentences with finite ACTIVE verbs, exactly like those examples: the names go in as possessives or objects, the subject of every clause is a person, claim or event from inside the video — the page making the claim, the argument under examination, the evidence that undoes it — and that subject DOES something in every sentence. The person speaking in the video is never that subject: the sentence is about what Islam has become, what the televangelist claims, what the meme invents — not about anyone pointing it out.
  - Attribution follows the first person: a testimony, a conversion story, a claim told in "I" belongs to the person telling it — never to the person it is addressed to, prayed over, or told about. Where the video's own commentary names who is speaking, that identification governs every sentence. And every characterization of who is being addressed and whose money, land, group or grievance is meant comes from the words in the input: an audience or a group the input does not name stays unnamed.

