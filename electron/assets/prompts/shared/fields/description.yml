# The DESCRIPTION section.
#
# WHO READS THIS. Everything that writes a description, which since 2026-08-22 includes the
# routed path again:
#
#   - DescriptionUnit's two schema-constrained calls (prompts/shared/pipeline/description.yml)
#     take this block whole, as their `{rules}`. The hook call writes sentence 1 of paragraph 1
#     and the body call writes the rest, and each says so; the rules below are what both are
#     bound by. They used to be withheld from those calls on the argument that they
#     over-specify a small model, and the one production run that happened under that
#     arrangement wrote a 324-word synopsis of the narrator with no second paragraph and no CTA
#     — on a prompt that reaches Sonnet and Opus unchanged. The note in the pipeline file
#     records the measurement.
#   - the COMPILATION call, which is the one surviving whole-metadata request and has always
#     read these rules in full.
#
# It also declares that the channel publishes a description at all (the `fields` list in
# prompts/channels/*.yml).
section: DESCRIPTION

# The register bullet at the end of `instructions` below has always said the true thing about a
# reaction channel — "Who is talking changes shot to shot — sometimes it is this channel,
# sometimes it is the footage being reacted to" — and until 2026-08-23 that was all it could say,
# because nothing told the model WHICH. Its answer was to make the speaker never the subject of a
# sentence, which dodges the problem rather than solving it: a description that names nobody
# cannot misattribute, and also cannot say who was right.
#
# Speaker tagging measures it. Where the transcript is tagged, this addendum is appended to the
# rules both description calls read, and it lifts the dodge for the one thing the tags settle:
# the description may now say who said something, because the transcript says. Untagged, it is
# not appended and the bullet stands alone exactly as before.
#
# It is a SEPARATE KEY rather than a line inside `instructions` for the reason every conditional
# in this tree is: `instructions` is also read whole by the compilation call, which has no
# transcript at all, and telling that call to read tags it was never shown would be a rule about
# nothing. Appended by description-unit.ts, beneath the section it qualifies.
tagged_addendum: |-
  - The transcript this description is written from is tagged by speaker: HOST: lines are this channel talking, CLIP: lines are the footage being reacted to, UNSURE: lines run across a cut and belong to nobody. Attribution therefore comes from the tags rather than from context: where a sentence says who claimed, framed, argued or admitted something, it names the side the tag gives — the footage's claim is the footage's, the channel's verdict is the channel's — and the content of an UNSURE line is written about with no speaker attached to it.

# The body call's word range, per field variant, as DATA so the number in the prompt and the
# number description-unit.ts warns against are one number. It measures the BODY only — the hook
# is a separate call under its own character cap — and a body outside it is a declared warning
# on a paragraph that still publishes, never a truncation.
#
# Per variant because the variants are different documents: a YouTube description is ONE
# paragraph (operator-directed 2026-08-23 — the second below-the-fold paragraph is gone; the
# chapter list code appends is what sits under the prose), a Spreaker episode note is 150-250
# words by its own rule below, and a Shorts description is two or three sentences nobody reads.
# One shared number would have made the warning wrong on two channels out of three.
#
# The range measures the BODY, which is the description MINUS its opening line: the hook is its
# own call under its own cap, and one paragraph of 3-5 further sentences runs 60 to 200 words.
body_words: [60, 200]

instructions: |-
  ## DESCRIPTION

  - ONE paragraph, 4-6 sentences, no line breaks inside it. The chapter list is appended below it by code, so the paragraph is the whole prose description.
  - Sentence 1 must work standalone as a search snippet — primary search phrase within the first 60 characters, and the full hook inside the first 157 characters (everything before "Show more"). Write it like the opening line of a news segment, not a diary entry.
  - Middle sentences: The specific claims being debunked, fact-checked, or exposed, with the real names and 2-3 secondary keywords woven in naturally. Keep it genuine; keyword-stuffed text is dead weight and gets ignored.
  - Final sentence: Channel positioning or soft CTA.
  - TRANSCRIPT/SUMMARY inputs: reference the single most damaging or absurd specific claim from the input in sentence 1
  - SHORT DESCRIPTION inputs: frame the topic and subject factually
  - Voice: confident, direct, slightly pissed. Banned phrases: "I'm still shaking," "what happened next," "you won't believe," "worse than we all feared," "everything changed," "broke the internet," "let that sink in," "I need to talk about this," "and honestly," "here's the thing," "buckle up"
  - Plugs inside the video — a book, a Patreon, a sponsor read, another channel — are already covered by the standing links block that code appends under the description. The description sells the claims and events the video takes apart; a plug shows up in it only as the plug it is ("and a promotion of the book Was Hitler an Atheist"), standing apart from the argument.
  - Register: this is a YouTube description — it sells the video to a stranger scrolling past, in the channel's own confident voice. Write about the claims, the events and the arguments themselves, built around the real names the input gives you — "Gene Bailey's chapter on Ziklag tells Christians to weaponize their wounds"; "Iowa spent three years blocking the Satanic Temple's holiday display while the man who axed their statue got probation". These are full sentences with finite ACTIVE verbs, exactly like those examples: the names go in as possessives or objects, the subject of every clause is a person, claim or event from inside the video — the page making the claim, the argument under examination, the evidence that undoes it — and that subject DOES something in every sentence.

self_check: []

overrides:
  shorts:
    instructions: |-
      ## DESCRIPTION

      - 2-3 sentences maximum (nobody reads Shorts descriptions — this is for the algorithm)
      - Sentence 1: subject name + primary keyword + what the clip shows. Functional, not persuasive.
      - Sentence 2: secondary keyword and content categorization context
      - The CTA lives in the pinned comment, not here
      - Keep it factual and keyword-rich; the clickbait-filler list applies here too
      - Voice doesn't matter here — this is metadata for machines, not humans
    self_check: []
    body_words: [25, 60]

  spreaker:
    instructions: |-
      ## DESCRIPTION

      - 150-250 words, plain text
      - FIRST 120 CHARACTERS (critical): Spotify shows ~120 characters and Apple ~150 before "show more" — this fragment must work as a standalone pitch that makes someone press play. Include the primary search phrase and the subject's full name, and be specific about what the episode delivers. No line breaks inside it.
      - Body: Expand on the specific claims debunked, evidence examined, or story told. Include concrete payoffs that signal depth: "every source traced", "each claim checked against the record", "the money followed to where it actually goes"
      - Use the primary search phrase once or twice more, woven naturally, plus related terms and every important name spelled fully — Spotify's semantic search rewards natural topical coverage; mechanical repetition does nothing and keyword stuffing violates Apple's guidelines
      - End with a brief CTA (subscribe, leave a review, check the website)
      - Keep the show title and host name out of it
      - TRANSCRIPT/SUMMARY inputs: reference the single most damaging or absurd specific claim from the input in the first 120 characters
      - SHORT DESCRIPTION inputs: frame the topic and subject factually
      - Voice: confident, direct, authoritative. Banned phrases: "I'm still shaking," "what happened next," "you won't believe," "worse than we all feared," "everything changed," "let that sink in," "I need to talk about this," "and honestly," "here's the thing," "buckle up"
      - Register: this note pitches the episode to someone deciding whether to press play, in the show's own confident voice. Write about the claims, the events and the arguments themselves, built around the real names the input gives you — "Gene Bailey's chapter on Ziklag tells Christians to weaponize their wounds"; "Iowa spent three years blocking the Satanic Temple's holiday display while the man who axed their statue got probation". These are full sentences with finite ACTIVE verbs, exactly like those examples: the names go in as possessives or objects, the subject of every clause is a person, claim or event from inside the episode — the page making the claim, the argument under examination, the evidence that undoes it — and that subject DOES something in every sentence.
    self_check: []
    body_words: [150, 250]
