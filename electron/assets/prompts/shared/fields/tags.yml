section: TAGS

instructions: |-
  ## TAGS

  - Write 8 to 12 tags, under 500 characters in total.
  - Start with the most specific two-to-four-word phrase for the video's subject, then the people, organizations and events it covers, then the broad category terms it belongs to.
  - Accurate and boring beats clever — tags are a labelling job, not a hook.
  - Every tag names something the video actually covers: YouTube reads a tag for something the video never mentions as a spam signal.
  - Work in two or three long-tail phrases a viewer would type into YouTube search. At most one tag may be a misspelling, and only of the main subject's personal name — misspelling coverage is the one tag use YouTube endorses, but a second tag that is another tag with a letter changed is a duplicate, not coverage. Organization names are always spelled correctly.
  - Include the terms a viewer types to find this channel: {brand_terms}. Those are the only channel-side tags in the list.
  - Every tag names the video's subject. The channel's own promotions — {promoted_items} — are ad reads inside the video; the tags are built from the content around them.
  - Answer with the whole list on one line, a comma between every tag: "subject full name,the specific claim,a common misspelling of the name,a long-tail search phrase,a channel brand term"

self_check:
  - "The tags value is one string with a comma between every tag — if any two tags are separated by a space alone, the comma goes back in"

overrides:
  shorts:
    instructions: |-
      ## TAGS

      - Write 5 to 8 tags.
      - Start with the most specific two-to-four-word phrase for the clip's subject, then the people and organizations in it, then the broad category terms it belongs to.
      - Accurate and boring beats clever — tags are a labelling job, not a hook.
      - Every tag names something the clip actually covers.
      - Include the terms a viewer types to find this channel: {brand_terms}, and the tag "shorts".
      - Answer with the whole list on one line, a comma between every tag: "subject full name,the topic keyword,a channel brand term,shorts"
    self_check:
      - "The tags value is one string with a comma between every tag — if any two tags are separated by a space alone, the comma goes back in"

  spreaker:
    instructions: |-
      ## TAGS (SPREAKER)

      - Write 10 to 15 tags, each ONE word: Spreaker takes single-word tags only, and refuses an episode carrying more than 20.
      - Start with the most specific single words for the episode's subject: the surnames and one-word names of the people, organizations and groups it covers, then the single words for its claims and doctrines, then the niche identifiers (atheism, skepticism) and the broad category terms it belongs to.
      - A name of two words becomes its distinctive word: Jim Bakker becomes Bakker, Kenneth Copeland becomes Copeland.
      - Accurate and boring beats clever — tags are a labelling job, not a hook.
      - Every tag is spelled correctly and no two tags name the same thing — these tags appear on Spreaker's own discovery pages, where a misspelling is a typo on display, not search coverage.
      - Every tag names the episode's subject: these tags power Spreaker's own discovery pages, so they say what the episode is about.
      - Answer with the whole list on one line, a comma between every tag and no spaces inside a tag: "Bakker,televangelist,prophecy,atheism,skepticism"
    self_check:
      - "The tags value is one string with a comma between every tag, and every tag is one word with no space in it"

  littlegoose:
    instructions: |-
      ## TAGS

      - Write 8 to 12 tags, under 400 characters in total, each in lowercase.
      - Start with the most specific two-to-four-word phrase for the song: the kind of song and who it is for, as a parent types it into search (a lullaby for small children is "lullaby for kids").
      - Then the song's own themes, animals and places, the way a parent searches for them, then the broad category terms of children's music it belongs to.
      - Accurate and boring beats clever — tags are a labelling job, not a hook.
      - Every tag is something the song is: its kind, its audience, or what its lyrics are about.
      - Answer with the whole list on one line, a comma between every tag: "bedtime song,lullaby for kids,woodland animals song,forest animals,songs for toddlers,kids songs"
    self_check:
      - "The tags value is one string with a comma between every tag — if any two tags are separated by a space alone, the comma goes back in"
