@if (setup.optionalDialogOpen()) {
  <div class="setup-backdrop" role="presentation">
    <section class="setup-dialog" role="dialog" aria-modal="true" aria-labelledby="setup-title">
      <button class="dialog-close" type="button" aria-label="Close setup" (click)="setup.closeOptionalDialog()">×</button>
      <header>
        <span class="eyebrow">ContentStudio setup</span>
        <h2 id="setup-title">Choose what powers your workflow</h2>
        <p>Connect ContentStudio to a Crucible server. You can change it later in Settings.</p>
      </header>

      @if (needsAI()) {
        <div class="setup-section ai-section">
          <div class="section-copy">
            <span class="section-mark">AI</span>
            <div>
              <!-- Every model call goes through Crucible (P2): the one door to it is the
                   readiness banner and Settings › Crucible Servers, not a provider wizard. -->
              <h3>Connect to Crucible</h3>
              <p>{{ setup.readiness()?.ai?.reason }} Set it up in Settings › Crucible Servers.</p>
            </div>
          </div>
        </div>
      }

      <footer>
        <button type="button" class="skip-action" (click)="setup.closeOptionalDialog()">Set up later</button>
      </footer>
    </section>
  </div>
}
